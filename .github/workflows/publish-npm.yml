name: Publish to npm

# Publishes the `regira` package to the npm registry.
# Triggered by pushing a version tag (v6.0.0) or manually via Actions → Run workflow.
# Requires the NPM_TOKEN repository secret. For the first publish this must be an all-packages
# (or org-scoped) npm access token — a granular token cannot be scoped to a package that does not
# exist on the registry yet; after the first publish it can be narrowed to read/write on `regira`.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance attestation

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Guard — tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Guard — version not already on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "regira@$VERSION" version >/dev/null 2>&1; then
            echo "regira@$VERSION is already published — bump the version first (npm versions are immutable)" >&2
            exit 1
          fi

      - name: Guard — CHANGELOG.md has a heading for this version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! grep -q "^## $VERSION" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $VERSION' heading — move the Unreleased entries under '## $VERSION — $(date +%F)' first" >&2
            exit 1
          fi

      # Runs the package's own `prepare` script, which builds dist/.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run types

      - name: Test
        run: npx vitest run

      # `prepare` rebuilds dist/ before packing, so the published tarball is always freshly built.
      # `--access public` is required alongside `--provenance`: npm refuses to attest a package that
      # does not exist on the registry yet unless the access level is stated explicitly.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
